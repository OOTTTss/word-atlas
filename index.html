<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F3ECDF" />
    <meta name="twitter:title" content="词光 · 基础词图鉴" />
    <meta name="twitter:image" content="https://ootttss.github.io/word-atlas/brand/og-card.jpg" />
    <title>词光 Word Atlas · 基础词图鉴</title>
    <meta name="description" content="看插画、听发音、练拼写。精选基础词，进度保存在当前浏览器，无需注册。" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="词光 · 基础词图鉴" />
    <meta property="og:description" content="精选基础词，搭配插画、英美发音和间隔复习。" />
    <meta property="og:image" content="https://ootttss.github.io/word-atlas/brand/og-card.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%icon-512.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <script>
      // Apply the saved theme (light by default) before first paint.
      (function () {
        var t = "light";
        try {
          var s = JSON.parse(localStorage.getItem("word-atlas-child:settings") || "{}");
          if (s.theme) t = s.theme;
        } catch (e) {}
        if (t !== "system") document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
